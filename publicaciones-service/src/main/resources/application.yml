server:
  port: 8081

spring:
  application:
    name: publicaciones-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/rica

  grpc:
    client:
      channel:
        investigadores:
          target: static://localhost:9090

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
