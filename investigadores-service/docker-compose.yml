services:
  rica-db:
    image: postgres:16
    container_name: investigadores-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rica
      POSTGRES_USER: rica
      POSTGRES_PASSWORD: rica
    ports:
      - "5432:5432"
    volumes:
      - investigadores-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rica -d rica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  investigadores-db-data:
